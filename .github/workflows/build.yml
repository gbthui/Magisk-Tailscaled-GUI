name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install build SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Test and build debug APK
        # Use the versions checked into the repository, not incompatible CI-only Kotlin/KSP downgrades.
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Upload test reports and debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-and-tests
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/apk/debug/*.apk

      # PR validation must not require signing secrets or replace the public latest-build release.
      - name: Decode release keystore
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
        run: |
          echo "$ENCODED_KEYSTORE" | base64 -d > "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build signed release
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: ./gradlew --no-daemon assembleRelease
        env:
          STORE_FILE: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Get short commit hash
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish pre-release
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: "latest-build"
          name: "最新构建 - commit ${{ steps.vars.outputs.short_sha }}"
          body: |
            ## 自动构建版本
            - Commit: ${{ github.sha }}
            - 构建时间: ${{ github.event.repository.updated_at }}
          artifacts: "app/build/outputs/apk/release/*.apk"
          prerelease: true
          allowUpdates: true
          omitBodyDuringUpdate: false
          omitNameDuringUpdate: false
          replacesArtifacts: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Send to Telegram
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          CHANNEL_ID: ${{ secrets.TELEGRAM_TO }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          COMMIT_MESSAGE: |
            **Github 自动构建**

            **版本:** ${{ steps.vars.outputs.short_sha }}
            **提交:** ${{ github.event.head_commit.message }}

            [查看详情](${{ github.event.head_commit.url }})
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*universal.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "未找到文件"
            exit 1
          fi
          ESCAPED_MSG=$(echo "$COMMIT_MESSAGE" | sed 's/[!_*()\[\]\\]/\\&/g')
          curl "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${CHANNEL_ID}" \
            -F "document=@${APK_FILE}" \
            -F "caption=${ESCAPED_MSG}" \
            -F "parse_mode=MarkdownV2"
