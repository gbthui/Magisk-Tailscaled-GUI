name: CI

on:
  push:
    branches: [ "master", "refactor/**" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install build SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Decode release keystore (optional)
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
        run: |
          if [ -n "$ENCODED_KEYSTORE" ]; then
            echo "$ENCODED_KEYSTORE" | base64 -d > "$KEYSTORE_PATH"
            echo "STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests and build release APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload test reports and release APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-and-tests
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/apk/release/*.apk

      - name: Get short commit hash
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish pre-release
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: "latest-build"
          name: "最新构建 - commit ${{ steps.vars.outputs.short_sha }}"
          body: |
            ## 自动构建版本
            - Commit: ${{ github.sha }}
            - 构建时间: ${{ github.event.repository.updated_at }}
          artifacts: "app/build/outputs/apk/release/*.apk"
          prerelease: true
          allowUpdates: true
          omitBodyDuringUpdate: false
          omitNameDuringUpdate: false
          replacesArtifacts: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
