name: Receiver ownership regressions
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-process-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [sh, mksh]
    steps:
      - uses: actions/checkout@v4
      - name: Install shell and optional lock implementations
        run: sudo apt-get update && sudo apt-get install -y mksh toybox busybox
      - name: Exercise root owner protocol with isolated processes
        shell: bash
        env:
          TEST_SHELL: ${{ matrix.shell }}
        run: |
          set -o pipefail
          mkdir -p test-reports
          export TC_TEST_SH="$(command -v "$TEST_SHELL")"
          bash tests/run-receiver-tests.sh 2>&1 | tee "test-reports/receiver-owner-$TEST_SHELL.txt"
      - name: Upload receiver test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receiver-owner-tests-${{ matrix.shell }}
          path: test-reports/
  android-mksh-fds:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Enable KVM for the disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual Android 15 mksh and toybox FD inheritance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ndk: 27.2.12479018
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash tests/run-android-fd-tests.sh
      - name: Upload actual Android FD results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-mksh-fd-tests
          path: test-reports/
