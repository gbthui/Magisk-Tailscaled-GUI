name: Receiver ownership regressions
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-process-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise root owner protocol with isolated processes
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-reports
          bash tests/run-receiver-tests.sh 2>&1 | tee test-reports/receiver-owner.txt
      - name: Upload receiver test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receiver-owner-tests
          path: test-reports/receiver-owner.txt
